<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROBOT control</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
:root {
    --bg-color: #0f111a;
    --bg-gray-10: #e0e0e0;
    --bg-gray-9: #d5d4d4;
    --bg-gray-8: #b3b3b3;
    --bg-gray-7: #9f9e9e;
    --bg-gray-4: #808080;
    --bg-gray-3: #6c6c6c;
    --bg-gray-2: #616161;
    --bg-gray-1: #373737;
    --bg-gray-0: #000000;
    --card-bg: #1a1d29;
    --accent-blue: #3a86ff;
    --light-lavander: #4a568aa1;
    --neon-red: #ff0044;
}

body {
    background-color: var(--light-lavander);
    color: #e0e0e0;
    font-family: 'Segoe UI', Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
}

.control-panel {
    background: var(--card-bg);
    border: 1px solid #333;
    border-radius: 12px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    overflow: hidden;
    max-width: 1050px;
}

.panel-header {
    background: #252936;
    padding: 15px 20px;
    border-bottom: 1px solid #333;
    display: flex;
    justify-content: space-between;
}

.sub-panel {
    border: 1px solid #2d323e;
    border-radius: 10px;
    padding: 25px;
    height: 100%;
}

.btn-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

.nav-btn {
    background: transparent;
    border: 2px solid #444;
    color: white;
    padding: 20px;
    border-radius: 12px;
    transition: 0.2s;
    font-size: 1.5rem;
}

.nav-btn:active,
.nav-btn.active {
    border-color: var(--accent-blue);
    box-shadow: 0 0 15px rgba(58, 134, 255, 0.4);
    color: var(--accent-blue);
}

.accessory-btn {
    padding: 14px 10px;
    font-size: 1.2rem;
}

.stop-btn {
    background: transparent;
    border: 3px solid var(--neon-red);
    color: white;
    border-radius: 50%;
    width: 100px;
    height: 100px;
    font-weight: bold;
    margin-top: 20px;
    box-shadow: 0 0 20px rgba(255, 0, 68, 0.2);
    transition: 0.3s;
}

.stop-btn:active {
    background: var(--neon-red);
    box-shadow: 0 0 30px var(--neon-red);
}

.accessory-label {
    font-size: 0.9rem;
    color: var(--bg-gray-8);
}

.angle-badge {
    font-size: 0.85rem;
    font-variant-numeric: tabular-nums;
    background: #252936;
    border: 1px solid #3a3f52;
    border-radius: 6px;
    padding: 2px 8px;
    color: var(--accent-blue);
    min-width: 38px;
    text-align: center;
}

.label-icon {
    font-size: 1.2rem;
    margin-right: 10px;
    opacity: 0.8;
}

#radar-canvas {
    display: block;
    margin: 0 auto;
    border-radius: 6px;
    background: #12151f;
}

.radar-status {
    font-size: 0.8rem;
    color: #555;
    letter-spacing: 0.03em;
}

.radar-legend {
    font-size: 0.72rem;
    color: var(--bg-gray-7);
    padding: 0 4px;
}

.legend-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-right: 3px;
}
.legend-dot.red    { background: #ff0044; }
.legend-dot.yellow { background: #ffa500; }
.legend-dot.blue   { background: #3a86ff; }

.form-range::-webkit-slider-thumb { background: var(--accent-blue); }
.form-range::-moz-range-thumb     { background: var(--accent-blue); }
.form-check-input:checked {
    background-color: var(--accent-blue);
    border-color: var(--accent-blue);
}
    </style>
</head>
<body id="body">

<div class="container container-error d-none" id="container-error">
    <h1 id="error-type">
        %error type% Error: <span class="conn-error-text error-description"
                                  id="error-description">%error description%</span>
    </h1>
    <h4>
        Verbose Log: <span class="conn-error-text error-log" id="error-log">%verbose log%</span>
    </h4>
</div>

<div class="container text-center" id="connecting-container">
    <h1 id="connecting-label">
        Connecting <span id="connecting-animation"> ... </span>
    </h1>
</div>

<div class="container control-panel px-0 d-none" id="main-container">
    <div class="panel-header d-flex justify-content-between align-items-center">
        <span>Delta robot control</span>
        <div class="robot-selector">
            <select
                id="robot-selector"
                class="form-select form-select-sm"
                onchange="set_robot(this.value)"
                style="width: 140px;"
            >
                <option value="1">Robot 1</option>
                <option selected value="2">Robot 2</option>
                <option value="3">Robot 3</option>
                <option value="4">Robot 4</option>
                <option value="0">All Robots</option>
                <option value="-1">No one</option>
            </select>
        </div>
    </div>

    <div class="row g-0 p-4" id="left-container">

        <!-- Column 1: Directional Control -->
        <div class="col-md-4 p-2">
            <div class="sub-panel text-center">
                <h6 class="mb-4 text-start">Directional Control</h6>
                <div class="btn-grid mx-auto" style="max-width: 220px;">
                    <button class="nav-btn" onpointerdown="start_drive('forward')" onpointerup="stop_drive()" onpointercancel="stop_drive()">
                        <i class="bi bi-caret-up-fill"></i>
                        <div style="font-size: 0.7rem;">Forward</div>
                    </button>
                    <button class="nav-btn" onpointerdown="start_drive('reverse')" onpointerup="stop_drive()" onpointercancel="stop_drive()">
                        <i class="bi bi-caret-down-fill"></i>
                        <div style="font-size: 0.7rem;">Reverse</div>
                    </button>
                    <button class="nav-btn" onpointerdown="start_drive('left')" onpointerup="stop_drive()" onpointercancel="stop_drive()">
                        <i class="bi bi-caret-left-fill"></i>
                        <div style="font-size: 0.7rem;">Left</div>
                    </button>
                    <button class="nav-btn" onpointerdown="start_drive('right')" onpointerup="stop_drive()" onpointercancel="stop_drive()">
                        <i class="bi bi-caret-right-fill"></i>
                        <div style="font-size: 0.7rem;">Right</div>
                    </button>
                </div>
                <button class="stop-btn" onclick="stop_drive()">STOP</button>
            </div>
        </div>

        <!-- Column 2: Claw & Lever -->
        <div class="col-md-4 p-2" id="right-container">
            <div class="sub-panel">
                <h6 class="mb-4">Claw &amp; Lever</h6>

                <div class="accessory-group mb-4">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <span class="accessory-label"><i class="bi bi-grip-horizontal label-icon"></i> Claw</span>
                        <span class="angle-badge" id="claw-angle-display">90°</span>
                    </div>
                    <div class="d-flex gap-2">
                        <button class="nav-btn accessory-btn flex-fill" onclick="claw_step('open')">
                            <i class="bi bi-arrows-expand"></i>
                            <div style="font-size: 0.7rem;">Open</div>
                        </button>
                        <button class="nav-btn accessory-btn flex-fill" onclick="claw_step('close')">
                            <i class="bi bi-arrows-collapse"></i>
                            <div style="font-size: 0.7rem;">Close</div>
                        </button>
                    </div>
                </div>

                <hr style="border-color: #333;">

                <div class="accessory-group mt-4">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <span class="accessory-label"><i class="bi bi-arrow-down-up label-icon"></i> Lever</span>
                        <span class="angle-badge" id="lever-angle-display">5°</span>
                    </div>
                    <div class="d-flex gap-2">
                        <button class="nav-btn accessory-btn flex-fill" onclick="lever_step('up')">
                            <i class="bi bi-arrow-up"></i>
                            <div style="font-size: 0.7rem;">Raise</div>
                        </button>
                        <button class="nav-btn accessory-btn flex-fill" onclick="lever_step('down')">
                            <i class="bi bi-arrow-down"></i>
                            <div style="font-size: 0.7rem;">Lower</div>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Column 3: Radar -->
        <div class="col-md-4 p-2">
            <div class="sub-panel text-center">
                <h6 class="mb-3 text-start">Radar</h6>
                <canvas id="radar-canvas" width="220" height="120"></canvas>
                <div class="d-flex justify-content-between mt-2 radar-legend">
                    <span><span class="legend-dot red"></span> &lt;400mm</span>
                    <span><span class="legend-dot yellow"></span> &lt;800mm</span>
                    <span><span class="legend-dot blue"></span> far</span>
                </div>
                <div id="radar-status" class="radar-status mt-2">No data</div>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script>
// --- app.js inlined ---
const SERVER_IP = window.location.hostname;
var socket;

const SOCKET_PACKET_STRUCTURE = {
    endpoint: "",
    mode: "",
    cmd: "",
    argc: ""
};

var main_container_div = null;
var body_div = null;

const ERROR_TYPES = Object.freeze({
    CONN_ERR: Symbol("Connection error"),
    DOM_ERR: Symbol("DOM error"),
});

const hard_dom_error =
    '<div class="container container-error d-none" id="container-error">' +
    '<h1 id="error-type">%error type% Error: ' +
    '<span class="conn-error-text error-description" id="error-description">%error description%</span></h1>' +
    '<h4>Verbose Log: <span class="conn-error-text error-log" id="error-log">%verbose log%</span></h4></div>';

function app_init() {
    main_container_div = document.getElementById("main-container");
    body_div = document.getElementById("body");

    try {
        socket = io();
    } catch (e) {
        display_error(ERROR_TYPES.CONN_ERR, "Client Library Error", e);
    }

    socket.on("connect", socket_init);
    socket.on("response", socket_message);

    socket.on("connect_error", (err) => {
        console.error("Connection failed", err);
        display_error(ERROR_TYPES.CONN_ERR, "Connection Error", "Socket error: " + err.message);
    });

    socket.on("robot_heartbeat", data => socket_message("heartbeat", data));
    socket.on("robot_event", data => socket_message("event", data));
    socket.on("robot_feedback", data => socket_message("feedback", data));
    socket.on("robot_error", data => socket_message("error", data));

    socket.on("disconnect", (reason) => {
        console.warn("Socket closed:", reason);
    });
}

function socket_init() {
    console.info("Socket connected");

    try {
        document.getElementById("connecting-container").classList.add("d-none");
        document.getElementById("main-container").classList.remove("d-none");
        document.getElementById("left-container").classList.remove("d-none");
        document.getElementById("right-container").classList.remove("d-none");
        const urlParams = new URLSearchParams(window.location.search);
        const targetRobotId = urlParams.get('robot_id');

        if (targetRobotId !== null) {
            set_robot(targetRobotId);
        } else {
            const selector = document.getElementById("robot-selector");
            if (selector) {
                set_robot(selector.value);
            } else {
                console.warn("No robot_id found in URL. Defaulting to robot 1.");
                set_robot(1);
            }
        }
    } catch (e) {
        display_error(ERROR_TYPES.CONN_ERR, "Client Init Error", e);
    }
}

function socket_message(type, data) {
    switch (data.event) {
        case "radar_scan_min": {
            add_debug_message(
                "feedback",
                `Robot ${data.robot_id}: Radar got closest obstacle at ${data.min_distance_mm} mm`
            );
            const radarEl = document.getElementById("radar-distance");
            if (radarEl) radarEl.innerText = data.min_distance_mm + " mm";
            break;
        }
        case "radar_scan":
            add_debug_message(
                "feedback",
                `Robot ${data.robot_id}: Radar got ${data.distance_mm} mm at angle ${data.angle}`
            );
            break;

        case "load_collected":
            add_debug_message("event", `Robot ${data.robot_id}: Acquired payload`);
            break;

        case "load_released":
            add_debug_message("event", `Robot ${data.robot_id}: Released payload`);
            break;

        default:
            add_debug_message(type, JSON.stringify(data));
    }
}

function add_debug_message(type, text) {
    const log = document.getElementById("debug-log");
    if (!log) {
        console.warn("debug-log container not found");
        return;
    }
    const isScrolledToBottom = log.scrollHeight - log.clientHeight - log.scrollTop < 30;
    const row = document.createElement("div");
    row.classList.add("log-entry");
    row.classList.add(`log-${type}`);
    const now = new Date().toLocaleTimeString();
    row.textContent = `[${now}] ${text}`;
    log.appendChild(row);
    while (log.children.length > 100) { log.removeChild(log.firstChild); }
    if (isScrolledToBottom) { log.scrollTop = log.scrollHeight; }
}

function socket_send(message) {
    if (!message || !message.endpoint) {
        console.warn("Invalid socket message or missing endpoint:", message);
        return;
    }
    let dynamicRobotId = null;
    const urlParams = new URLSearchParams(window.location.search);
    const urlRobotId = urlParams.get('robot_id');
    if (urlRobotId !== null) {
        dynamicRobotId = Number(urlRobotId);
    } else {
        const bodyEl = document.getElementById("body");
        const bodyRobotId = bodyEl ? bodyEl.getAttribute('data-robot-id') : null;
        if (bodyRobotId !== null) { dynamicRobotId = Number(bodyRobotId); }
    }
    const payload = {
        robot_id: (dynamicRobotId !== null && !isNaN(dynamicRobotId)) ? dynamicRobotId : -1,
        mode: message.mode,
        cmd: message.cmd,
        argc: message.argc
    };
    let UI_log_text = `UI Command: endpoint='${message.endpoint}' | cmd='${message.cmd}'`;
    if (message.argc !== null && message.argc !== undefined && message.argc !== "") {
        UI_log_text += ` | value=${message.argc}`;
    }
    add_debug_message("event", UI_log_text);
    try {
        socket.emit(message.endpoint, payload);
    } catch (e) {
        console.warn("Transmission failure:", e);
    }
}

function display_error(error_type, error_description, error_log) {
    let error_type_str = "";
    switch (error_type) {
        case ERROR_TYPES.CONN_ERR:
            error_type_str = "Connection error";
            let div = document.getElementById("container-error");
            if (div != null) { div.classList.remove("d-none"); }
            else { display_error(ERROR_TYPES.DOM_ERR, "", "container-error not found"); return; }
            break;
        case ERROR_TYPES.DOM_ERR:
        default:
            error_type_str = "DOM error";
            error_description = "DOM Content Loading Failed. Reload page";
            if (body_div) { body_div.innerHTML = hard_dom_error; }
            break;
    }
    const elType = document.getElementById("error-type");
    const elDesc = document.getElementById("error-description");
    const elLog  = document.getElementById("error-log");
    if (elType && elDesc && elLog) {
        elType.innerText = error_type_str;
        elDesc.innerText = error_description;
        elLog.innerText  = error_log;
    } else {
        console.error(`UI Error Elements missing! Context: ${error_type_str} - ${error_description}`);
        alert(`${error_type_str}: ${error_description}\n\nLog: ${error_log}`);
    }
    document.getElementById("container-error").classList.remove("d-none");
}

function set_robot(controlled_robot) {
    console.info("Setting destination robot to", controlled_robot);
    let n = Number(controlled_robot);
    let argc = Number.isFinite(n) ? n : -2;
    let msg = {...SOCKET_PACKET_STRUCTURE};
    msg.mode = "settings";
    msg.endpoint = "control_settings";
    msg.cmd = "destination_robot";
    msg.argc = argc;
    socket_send(msg);
}

function emergency_stop() {
    let msg = {...SOCKET_PACKET_STRUCTURE};
    msg.mode = "manual"; msg.endpoint = "command"; msg.cmd = "stop"; msg.argc = "stop";
    socket_send(msg);
}

function reset() {
    let msg = {...SOCKET_PACKET_STRUCTURE};
    msg.mode = "manual"; msg.endpoint = "command"; msg.cmd = "reset"; msg.argc = "reset";
    socket_send(msg);
}

function drive(direction) {
    let msg = {...SOCKET_PACKET_STRUCTURE};
    msg.mode = "manual"; msg.endpoint = "command"; msg.cmd = "drive"; msg.argc = direction;
    socket_send(msg);
}

function set_property(feature, action) {
    let msg = {...SOCKET_PACKET_STRUCTURE};
    msg.mode = "manual"; msg.endpoint = "set_property";
    switch (feature.toUpperCase()) {
        case "SPEED":    msg.cmd = "speed";             msg.argc = Number(action); break;
        case "RADAR":    msg.cmd = "radar";             msg.argc = Number(action); break;
        case "LIGHTS":   msg.cmd = "lights";            msg.argc = Number(action); break;
        case "HORN":     msg.cmd = "horn";              msg.argc = Number(action); break;
        case "TRUNK":    msg.cmd = "OBJECT_UNLOADER";   msg.argc = Number(action); break;
        case "BRUSHES":  msg.cmd = "OBSTACLE_CLEANER";  msg.argc = Number(action); break;
        case "CLAW":     msg.cmd = "OBJECT_LOADER";     msg.argc = Number(action); break;
        case "NAVIGATION_TYPE": msg.cmd = "NAVIGATION_TYPE"; msg.argc = Number(action); break;
        default: console.warn("Unrecognized feature."); return;
    }
    socket_send(msg);
}

document.addEventListener("DOMContentLoaded", app_init);
</script>
<script>
// --- Delta-specific additions ---

// Accessory state (no longer in app.js)
const CLAW_ANGLE_MIN = 25;
const CLAW_ANGLE_MAX = 90;
const LEVER_ANGLE_MIN = 5;
const LEVER_ANGLE_MAX = 74;
const SERVO_STEP = 5;
var claw_angle  = CLAW_ANGLE_MAX;
var lever_angle = LEVER_ANGLE_MIN;

// Radar accumulator
var radar_by_angle = {};

// Drive hold
var _drive_timer = null;

function start_drive(direction) {
    stop_drive();
    drive(direction);
    _drive_timer = setInterval(function() { drive(direction); }, 120);
}

function stop_drive() {
    if (_drive_timer !== null) { clearInterval(_drive_timer); _drive_timer = null; }
    drive('stop');
}

// Claw: step angle and send via set_property (uses app.js's set_property CLAW case)
function claw_step(direction) {
    if (direction === 'open') {
        claw_angle = Math.max(claw_angle - SERVO_STEP, CLAW_ANGLE_MIN);
    } else {
        claw_angle = Math.min(claw_angle + SERVO_STEP, CLAW_ANGLE_MAX);
    }
    document.getElementById("claw-angle-display").innerText = claw_angle + "°";
    set_property("CLAW", claw_angle);
}

// Lever: step angle and send via set_property (uses app.js's set_property TRUNK case)
function lever_step(direction) {
    if (direction === 'up') {
        lever_angle = Math.max(lever_angle - SERVO_STEP, LEVER_ANGLE_MIN);
    } else {
        lever_angle = Math.min(lever_angle + SERVO_STEP, LEVER_ANGLE_MAX);
    }
    document.getElementById("lever-angle-display").innerText = lever_angle + "°";
    set_property("TRUNK", lever_angle);
}

// Extend socket_message: keep app.js debug logging, add radar canvas drawing
const _base_socket_message = socket_message;
socket_message = function(type, data) {
    _base_socket_message(type, data);
    if (data.event === "online") {
        add_debug_message("event", `Robot ${data.robot_id}: Online`);
    } else if (data.event === "radar_scan") {
        radar_by_angle[data.angle] = data.distance_mm;
        radar_draw(Object.entries(radar_by_angle).map(([a, d]) => ({angle: parseInt(a), dist: d})));
    } else if (data.event === "radar_scan_min") {
        const el = document.getElementById("radar-status");
        if (el) {
            if (data.min_distance_mm < 400) {
                el.innerText = "Obstacle: " + data.min_distance_mm + " mm";
                el.style.color = "#ff0044";
            } else {
                el.innerText = "Clear (" + data.min_distance_mm + " mm min)";
                el.style.color = "#3a86ff";
            }
        }
    }
}

// Extend socket_init: initialise radar canvas after connect
const _base_socket_init = socket_init;
socket_init = function() {
    _base_socket_init();
    radar_draw([]);
}

// Radar canvas: 500 mm scale, corrected orientation
function radar_draw(readings) {
    const canvas = document.getElementById('radar-canvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    const cx = W / 2, cy = H - 8;
    const maxR = H - 18;
    const maxDist = 500;

    ctx.clearRect(0, 0, W, H);

    ctx.fillStyle = '#12151f';
    ctx.beginPath();
    ctx.arc(cx, cy, maxR, Math.PI, 0);
    ctx.lineTo(cx, cy);
    ctx.closePath();
    ctx.fill();

    for (let frac of [0.25, 0.5, 0.75]) {
        ctx.beginPath(); ctx.strokeStyle = '#2d323e'; ctx.lineWidth = 1;
        ctx.arc(cx, cy, maxR * frac, Math.PI, 0); ctx.stroke();
    }

    ctx.beginPath(); ctx.strokeStyle = '#444'; ctx.lineWidth = 1;
    ctx.arc(cx, cy, maxR, Math.PI, 0); ctx.stroke();

    ctx.beginPath(); ctx.strokeStyle = '#444';
    ctx.moveTo(cx - maxR, cy); ctx.lineTo(cx + maxR, cy); ctx.stroke();

    for (let deg of [30, 60, 90, 120, 150]) {
        let rad = deg * Math.PI / 180;
        ctx.beginPath(); ctx.strokeStyle = '#2d323e';
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + maxR * Math.cos(rad), cy - maxR * Math.sin(rad));
        ctx.stroke();
    }

    if (readings.length === 0) {
        ctx.fillStyle = '#555'; ctx.font = '11px Segoe UI'; ctx.textAlign = 'center';
        ctx.fillText('No data', cx, cy - maxR / 2);
    } else {
        for (let r of readings) {
            if (r.dist <= 0) continue;
            let ratio = Math.min(r.dist, maxDist) / maxDist;
            let rad = r.angle * Math.PI / 180;
            let px = cx + maxR * ratio * Math.cos(rad);
            let py = cy - maxR * ratio * Math.sin(rad);
            ctx.beginPath();
            ctx.fillStyle = r.dist < 400 ? '#ff0044' : r.dist < 800 ? '#ffa500' : '#3a86ff';
            ctx.arc(px, py, 3, 0, 2 * Math.PI); ctx.fill();
        }
    }

    ctx.beginPath(); ctx.fillStyle = '#e0e0e0';
    ctx.arc(cx, cy, 4, 0, 2 * Math.PI); ctx.fill();
}


</script>
</body>
</html>
