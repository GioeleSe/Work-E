<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROBOT control</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='/style.css') }}">
</head>
<body id="body">

<div class="container container-error d-none" id="container-error">
    <h1 id="error-type">
        %error type% Error: <span class="conn-error-text error-description"
                                  id="error-description">%error description%</span>
    </h1>
    <h4>
        Verbose Log: <span class="conn-error-text error-log" id="error-log">%verbose log%</span>
    </h4>
</div>

<div class="container text-center" id="connecting-container">
    <h1 id="connecting-label">
        Connecting <span id="connecting-animation"> ... </span>
    </h1>
</div>

<div class="container control-panel px-0 d-none" id="main-container">
    <div class="panel-header d-flex justify-content-between align-items-center">
        <span>Delta robot control</span>
        <div class="robot-selector">
            <select
                id="robot-selector"
                class="form-select form-select-sm"
                onchange="set_robot(this.value)"
                style="width: 140px;"
            >
                <option selected value="1">Robot 1</option>
                <option value="2">Robot 2</option>
                <option value="3">Robot 3</option>
                <option value="4">Robot 4</option>
                <option value="0">All Robots</option>
                <option value="-1">No one</option>
            </select>
        </div>
    </div>

    <div class="row g-0 p-4" id="left-container">

        <!-- Column 1: Directional Control -->
        <div class="col-md-4 p-2">
            <div class="sub-panel text-center">
                <h6 class="mb-4 text-start">Directional Control</h6>
                <div class="btn-grid mx-auto" style="max-width: 220px;">
                    <button class="nav-btn" onmousedown="drive('forward')" onmouseup="drive('stop')">
                        <i class="bi bi-caret-up-fill"></i>
                        <div style="font-size: 0.7rem;">Forward</div>
                    </button>
                    <button class="nav-btn" onmousedown="drive('reverse')" onmouseup="drive('stop')">
                        <i class="bi bi-caret-down-fill"></i>
                        <div style="font-size: 0.7rem;">Reverse</div>
                    </button>
                    <button class="nav-btn" onmousedown="drive('left')" onmouseup="drive('stop')">
                        <i class="bi bi-caret-left-fill"></i>
                        <div style="font-size: 0.7rem;">Left</div>
                    </button>
                    <button class="nav-btn" onmousedown="drive('right')" onmouseup="drive('stop')">
                        <i class="bi bi-caret-right-fill"></i>
                        <div style="font-size: 0.7rem;">Right</div>
                    </button>
                </div>
                <button class="stop-btn" onclick="emergency_stop()">STOP</button>
            </div>
        </div>

        <!-- Column 2: Claw & Lever -->
        <div class="col-md-4 p-2" id="right-container">
            <div class="sub-panel">
                <h6 class="mb-4">Claw &amp; Lever</h6>

                <div class="accessory-group mb-4">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <span class="accessory-label"><i class="bi bi-grip-horizontal label-icon"></i> Claw</span>
                        <span class="angle-badge" id="claw-angle-display">90°</span>
                    </div>
                    <div class="d-flex gap-2">
                        <button class="nav-btn accessory-btn flex-fill" onclick="claw_step('open')">
                            <i class="bi bi-arrows-expand"></i>
                            <div style="font-size: 0.7rem;">Open</div>
                        </button>
                        <button class="nav-btn accessory-btn flex-fill" onclick="claw_step('close')">
                            <i class="bi bi-arrows-collapse"></i>
                            <div style="font-size: 0.7rem;">Close</div>
                        </button>
                    </div>
                </div>

                <hr style="border-color: #333;">

                <div class="accessory-group mt-4">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <span class="accessory-label"><i class="bi bi-arrow-down-up label-icon"></i> Lever</span>
                        <span class="angle-badge" id="lever-angle-display">5°</span>
                    </div>
                    <div class="d-flex gap-2">
                        <button class="nav-btn accessory-btn flex-fill" onclick="lever_step('up')">
                            <i class="bi bi-arrow-up"></i>
                            <div style="font-size: 0.7rem;">Raise</div>
                        </button>
                        <button class="nav-btn accessory-btn flex-fill" onclick="lever_step('down')">
                            <i class="bi bi-arrow-down"></i>
                            <div style="font-size: 0.7rem;">Lower</div>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Column 3: Radar -->
        <div class="col-md-4 p-2">
            <div class="sub-panel text-center">
                <h6 class="mb-3 text-start">Radar</h6>
                <canvas id="radar-canvas" width="220" height="120"></canvas>
                <div class="d-flex justify-content-between mt-2 radar-legend">
                    <span><span class="legend-dot red"></span> &lt;400mm</span>
                    <span><span class="legend-dot yellow"></span> &lt;800mm</span>
                    <span><span class="legend-dot blue"></span> far</span>
                </div>
                <div id="radar-status" class="radar-status mt-2">No data</div>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script src="{{ url_for('static', filename='/app.js') }}"></script>
</body>
</html>
